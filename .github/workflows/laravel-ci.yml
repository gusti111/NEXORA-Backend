name: Laravel CI

on:
  push:
    branches: [main, 'fix/**', 'feat/**']
  pull_request:
    branches: [main, 'fix/**']

permissions:
  contents: read

jobs:
  test:
    name: Validate and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, curl, dom, fileinfo, gd, intl, pdo_sqlite, sqlite3, xml, zip
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare application environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Laravel test suite
        run: php artisan test

  local-staging-script:
    name: Validate Windows local-staging script
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse PowerShell script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $scriptPath = Join-Path $PWD 'scripts/start-local-staging.ps1'
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            $scriptPath,
            [ref]$tokens,
            [ref]$errors
          )

          if ($errors.Count -gt 0) {
            $errors | Format-List *
            throw "PowerShell parser reported errors in start-local-staging.ps1"
          }

          Write-Host "PowerShell syntax is valid."
